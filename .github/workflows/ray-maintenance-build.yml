name: RayXDesktop Windows
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [ray-desktop-maintenance]
    paths:
      - maintenance/releases/1.4.6.md

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Run core regression tests
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: Test and package
        shell: powershell
        run: .\maintenance\build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RayXDesktop-Windows
          path: RayXDesktop-Windows.zip
          if-no-files-found: error

  publish-146:
    if: github.event_name == 'push' && github.repository == 'D-Synx/Ray-Desktop'
    needs: portable
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RayXDesktop-Windows
          path: release-assets
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.6 .\release-assets\RayXDesktop-Windows.zip --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "RayXDesktop 1.4.6" --notes-file .\maintenance\releases\1.4.6.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish RayXDesktop 1.4.6.' }
