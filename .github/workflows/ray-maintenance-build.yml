name: RayXDesktop Windows
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Run core regression tests
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: Test and package
        shell: powershell
        run: .\maintenance\build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RayXDesktop-Windows
          path: RayXDesktop-Windows.zip
          if-no-files-found: error
